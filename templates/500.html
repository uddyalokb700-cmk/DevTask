<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — DevTask</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 3rem;
      max-width: 540px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h1 class="h3 fw-semibold text-light mb-3">Internal Server Error</h1>
    <p class="text-secondary mb-4">
      An unexpected error occurred while processing your request. The engineering incident has been logged.
    </p>
    <a href="/" class="btn btn-primary px-4">
      Return to Home
    </a>
  </div>
</body>
</html>
