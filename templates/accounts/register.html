{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — DevTask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/theme.css' %}" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #161c29 0%, #090b10 80%);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.25rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon-box mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.35rem;">
        <i class="bi bi-person-plus"></i>
      </div>
      <h4 class="fw-bold mb-1" style="color: #fff;">Create DevTask Account</h4>
      <p class="text-muted small">Join your engineering team to collaborate on projects</p>
    </div>

    <div id="authErrorBox" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>

    <form id="registerForm">
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label for="username" class="form-label small fw-semibold text-secondary">Username *</label>
          <input type="text" id="username" class="form-control form-control-devtask" placeholder="e.g. dev_sarah" required autofocus>
        </div>
        <div class="col-md-6">
          <label for="displayName" class="form-label small fw-semibold text-secondary">Display Name</label>
          <input type="text" id="displayName" class="form-control form-control-devtask" placeholder="Sarah Connor">
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-secondary">Email Address *</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary-subtle text-muted">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" id="email" class="form-control form-control-devtask" placeholder="sarah@company.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold text-secondary">Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary-subtle text-muted">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="password" class="form-control form-control-devtask" placeholder="At least 8 characters" required>
          <button class="btn btn-outline-secondary border-secondary-subtle toggle-password-btn" type="button" data-target="password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label for="passwordConfirm" class="form-label small fw-semibold text-secondary">Confirm Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary-subtle text-muted">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input type="password" id="passwordConfirm" class="form-control form-control-devtask" placeholder="Re-enter password" required>
          <button class="btn btn-outline-secondary border-secondary-subtle toggle-password-btn" type="button" data-target="passwordConfirm">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-devtask-primary w-100 py-2 justify-content-center fw-semibold mb-3">
        Register Account
      </button>

      <div class="text-center small text-secondary">
        Already registered?
        <a href="{% url 'accounts:login' %}" class="text-primary text-decoration-none fw-semibold">Sign in here</a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
